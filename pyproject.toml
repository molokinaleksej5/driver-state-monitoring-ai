[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-state-nn"
version = "0.1.0"
description = "Neural network system for driver state monitoring during movement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Diploma Project"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
